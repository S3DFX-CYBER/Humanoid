version: "3.9"

services:
  # ── Data Stores ──────────────────────────────────────────────

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: humanoid
      POSTGRES_PASSWORD: humanoid
      POSTGRES_DB: humanoid
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U humanoid"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Application Services ────────────────────────────────────

  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://humanoid:humanoid@postgres:5432/humanoid
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://humanoid:humanoid@postgres:5432/humanoid
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - .:/app
    command: arq workers.worker.WorkerSettings

  # ── Isolated Services ───────────────────────────────────────

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    ports:
      - "8001:8001"
    # No DB or Redis access — isolated by design

  render:
    build:
      context: .
      dockerfile: render/Dockerfile
    ports:
      - "8002:8002"
    # No DB or Redis access — isolated by design

volumes:
  pgdata:
