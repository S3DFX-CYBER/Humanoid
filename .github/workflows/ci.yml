name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: humanoid
          POSTGRES_PASSWORD: humanoid
          POSTGRES_DB: humanoid
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]" flake8 mypy

    - name: Run linting
      run: |
        flake8 api workers providers ingestion render
        mypy api workers providers ingestion render --ignore-missing-imports

    - name: Run tests (with coverage)
      env:
        DATABASE_URL: postgresql://humanoid:humanoid@localhost:5432/humanoid
        REDIS_URL: redis://localhost:6379
        ENVIRONMENT: test
      run: |
        # Setup schema
        psql -h localhost -U humanoid -d humanoid -f db/schema.sql
        
        # Run pytest
        pytest tests/ -v
