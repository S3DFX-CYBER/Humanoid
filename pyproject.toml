[project]
name = "humanoid"
version = "0.1.0"
description = "AI research and drafting assistant for academic work"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "arq>=0.26.0",
    "redis>=5.0.0",
    "asyncpg>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
    "google-generativeai>=0.8.0",
    "supabase>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]
ingestion = [
    "pymupdf>=1.24.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.23",
    "pytesseract>=0.3.10",
    "Pillow>=10.0.0",
]
render = [
    "python-docx>=1.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["api*", "workers*", "providers*", "ingestion*", "render*", "db*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
